name: arena-tick

# 策略竞技场云端引擎：每 30 分钟（UTC :08/:38，避开整点半点拥塞）
# 信号生成 → 回填结算 → 赛季进化，状态存 data/arena/state.json
# 不开网站也持续运行；选手进程不会被浏览器关闭打断
on:
  schedule:
    # 每 15 分钟一个触发槽（GitHub 定时队列延迟严重，密集槽位提高成活率）
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止排队堆积：新运行到来时取消还在跑的旧运行（状态只在最后原子提交，中断安全）
concurrency:
  group: arena-tick
  cancel-in-progress: true

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install numpy

      - name: Run arena tick
        run: python train/arena_tick.py

      - name: Commit arena state
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add data/arena/state.json
          if git diff --staged --quiet; then
            echo "竞技场状态无变化，跳过提交"
          else
            git commit -m "🏟️ 竞技场 tick · $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "推送冲突，第 $i 次重试…"
              sleep 5
            done
          fi
