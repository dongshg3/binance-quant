name: quant-model-training

# 每 6 小时自动训练一次（UTC），也可手动触发
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install numpy

      - name: Train factor weights
        env:
          TQ_TOP_N: '150'        # 训练币种池：Top 150 高流动性 USDT 交易对
          TQ_MIN_SAMPLES: '60000'
        run: python train/train.py

      - name: Commit model artifacts
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add data/model.json data/evolution.json
          if git diff --staged --quiet; then
            echo "模型无变化，跳过提交"
          else
            git commit -m "🤖 模型进化 v$(python -c "import json;print(json.load(open('data/model.json'))['version'])") · $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            git push
          fi
