name: quant-model-training

# 每 6 小时自动训练一次（UTC），也可手动触发
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy + scikit-learn
        run: pip install numpy scikit-learn

      - uses: actions/cache@v4
        with:
          path: data_cache
          key: futures-dump-v1

      - name: Train factor weights
        env:
          TQ_TOP_N: '400'        # 接近全市场覆盖；新币历史不足时进入 warmup
          TQ_MIN_SAMPLES: '200000'
          TQ_ET_FOLDS: '3'
          TQ_ET_TREES: '80'
          TQ_COIN_HGB: '1'
        run: python train/train.py

      - name: Commit model artifacts
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add data/model.json data/evolution.json
          if git diff --staged --quiet; then
            echo "模型无变化，跳过提交"
          else
            git commit -m "🤖 模型进化 v$(python -c "import json;print(json.load(open('data/model.json'))['version'])") · $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            # 训练期间网站可能部署了新提交 → 先 rebase 再推，避免非快进拒绝
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "推送冲突，第 $i 次重试…"
              sleep 5
            done
          fi
