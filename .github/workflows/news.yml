name: news-sentiment-fetch

# 每小时抓取消息面数据（UTC，避开整点拥塞），也可手动触发
# 产出 data/news.json（前端消息面因子直接消费）+ data/news_history.json（30 天滚动历史，供未来训练）
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install VADER
        run: pip install vaderSentiment

      - name: Fetch news sentiment
        run: python train/news_fetch.py

      - name: Commit news snapshot
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add data/news.json data/news_history.json
          if git diff --staged --quiet; then
            echo "消息面无变化，跳过提交"
          else
            git commit -m "📰 消息面快照 · $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "推送冲突，第 $i 次重试…"
              sleep 5
            done
          fi
