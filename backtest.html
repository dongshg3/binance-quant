<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回测中心 · 币安量化系统</title>
<meta name="description" content="多因子策略历史回测：夏普、最大回撤、盈亏比、信号命中率，对比买入持有">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="css/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 5v4'/><rect width='4' height='6' x='7' y='9' rx='1'/><path d='M9 15v2'/><path d='M17 3v2'/><rect width='4' height='8' x='15' y='5' rx='1'/><path d='M17 13v3'/><path d='M3 3v16a2 2 0 0 0 2 2h16'/></svg>">
</head>
<body>
<div class="page">

  <div class="controls">
    <select id="marketSelect">
      <option value="futures" selected>U本位合约</option>
      <option value="spot">现货</option>
    </select>
    <span id="symbolPickerWrap"></span>
    <select id="intervalSelect">
      <option value="15m">15分钟</option>
      <option value="1h" selected>1小时</option>
      <option value="4h">4小时</option>
      <option value="1d">日线</option>
    </select>
    <label>K线数 <input id="limitInput" type="number" value="1000" step="100" style="width:80px"></label>
    <label>费率% <input id="feeInput" type="number" value="0.05" step="0.01" style="width:65px"></label>
    <label>滑点% <input id="slipInput" type="number" value="0.02" step="0.01" style="width:65px"></label>
    <label>资金费%/8h <input id="fundingInput" type="number" value="0.01" step="0.01" style="width:70px"></label>
    <label>信号阈值 <select id="thresholdInput"><option value="0.15">0.15</option><option value="0.25">0.25</option><option value="0.35">0.35</option></select></label>
    <label>最小调仓 <select id="rebalanceInput"><option value="0.05">5%</option><option value="0.1" selected>10%</option><option value="0.2">20%</option></select></label>
    <button id="runBtn" class="primary"><span data-icon="play"></span>运行回测</button>
    <button id="exportBtBtn" title="导出调仓记录"><span data-icon="download"></span>导出交易</button>
    <span style="font-size:11px;color:var(--text-dim)" id="btStatus"></span>
  </div>

  <!-- 绩效指标 -->
  <div class="panel" style="margin-bottom:14px;">
    <h3><span data-icon="trendUp"></span>策略绩效 <span class="sub" id="btSub">尚未运行</span></h3>
    <div class="grid-metrics" id="btMetrics"><div class="placeholder" style="grid-column:1/-1;">选择参数后点击「运行回测」</div></div>
  </div>

  <!-- 净值曲线 -->
  <div class="chart-wrap" style="margin-bottom:14px;">
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">
      <span style="color:#2563eb;">—</span> 策略净值 &nbsp;&nbsp;
      <span style="color:#94a3b8;">—</span> 买入持有基准 &nbsp;&nbsp;
      <span style="color:#dc2626;">—</span> 回撤(右轴)
    </div>
    <div id="eqChart" class="chart-box" style="height:340px;"></div>
  </div>

  <div class="row cols-2">
    <!-- 时段外推验证 -->
    <div class="panel">
      <h3><span data-icon="flask"></span>时段稳健性 <span class="sub">70/30 切分 · 200 bar 隔离带 · 不在浏览器重训模型</span></h3>
      <table>
        <thead><tr><th>指标</th><th style="text-align:right">前段 (70%)</th><th style="text-align:right">后段（隔离后）</th></tr></thead>
        <tbody id="oosBody"><tr><td colspan="3" class="placeholder">尚未运行</td></tr></tbody>
      </table>
      <div id="oosVerdict" style="font-size:12px;margin-top:10px;"></div>
    </div>
    <!-- 基准对比 -->
    <div class="panel">
      <h3><span data-icon="scale"></span>与买入持有对比</h3>
      <table>
        <thead><tr><th>指标</th><th style="text-align:right">多因子策略</th><th style="text-align:right">买入持有</th></tr></thead>
        <tbody id="compareBody"><tr><td colspan="3" class="placeholder">尚未运行</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="row cols-2">
    <div class="panel">
      <h3><span data-icon="shield"></span>统计稳健性 <span class="sub">概率夏普比率 · 循环区块 Bootstrap 240 次</span></h3>
      <div class="grid-metrics" id="robustMetrics"><div class="placeholder" style="grid-column:1/-1;">运行后计算</div></div>
      <div class="fold-track" id="foldTrack"></div>
      <div class="model-reason">时段切分用于检验收益稳定性，不会把已发布模型伪装成浏览器重新拟合后的样本外模型。</div>
    </div>
    <div class="panel">
      <h3><span data-icon="scale"></span>参数敏感性 <span class="sub">同一信号路径下的阈值与成本压力</span></h3>
      <div class="scroll-table" style="max-height:250px;"><table>
        <thead><tr><th>实验</th><th style="text-align:right">净收益</th><th style="text-align:right">夏普</th><th style="text-align:right">回撤</th></tr></thead>
        <tbody id="sensitivityBody"><tr><td colspan="4" class="placeholder">运行后计算</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <div class="row" style="grid-template-columns:1fr;">
    <!-- 调仓记录 -->
    <div class="panel">
      <h3><span data-icon="clipboard"></span>调仓记录 <span class="sub" id="tradeCount"></span></h3>
      <div class="scroll-table" style="max-height:320px;">
        <table>
          <thead><tr><th>时间</th><th>方向</th><th>仓位变化</th><th style="text-align:right">价格</th><th style="text-align:right">评分</th></tr></thead>
          <tbody id="tradesBody"><tr><td colspan="5" class="placeholder">尚未运行</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="disclaimerSlot"></div>
</div>
<script type="module" src="js/backtest.js"></script>
<script type="module" src="js/visual-fx.js"></script>
</body>
</html>
